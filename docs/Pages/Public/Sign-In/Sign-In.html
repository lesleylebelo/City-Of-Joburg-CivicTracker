<body class="auth-page">
    <a class="skip-link" href="#main-content">Skip to form</a>
    <header class="auth-header">
        <a class="auth-brand" href="../../../index.html"><span class="city-logo-shell brand-city-mark"><img class="city-logo" src="../../../Assets/Images/Joburg%20Logo.jpg" width="58" height="45" alt="City of Johannesburg"></span><span class="auth-brand-copy"><strong>CivicTrack</strong></span></a>
        <a class="auth-home" href="../../../index.html">Back home <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="vertical-align:-0.2em;flex-shrink:0"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></a>
    </header>
    <main class="auth-shell" id="main-content" tabindex="-1">
        <aside class="auth-scene" aria-label="Johannesburg"><p class="auth-scene-line">Report. Track. Improve Joburg.</p></aside>
        <section class="auth-panel" aria-labelledby="auth-form-heading">
            <div class="auth-form-content">
                <h1 id="auth-form-heading">Sign in to report.</h1>
                <p class="auth-intro">Track your reports and get updates.</p>
                <form id="sign-in-form" class="auth-form" aria-describedby="sign-in-feedback">
<div class="auth-field"><label for="identifier">Email or account ID</label><input id="identifier" name="identifier" type="text" autocomplete="username" maxlength="150" required></div>
<div class="auth-field"><label for="password">Password</label><div class="auth-password"><input id="password" name="password" aria-describedby="sign-in-feedback" type="password" autocomplete="current-password"  maxlength="1024" required data-password-label="password"><button class="auth-reveal" type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button></div></div>
<div class="auth-utility"><a href="../Recover-Account/Recover-Account.html">Forgot password?</a></div>
<div id="identifier-help"><p id="sign-in-feedback" class="auth-feedback" role="alert" aria-live="assertive" aria-atomic="true"></p></div>
<button class="auth-submit" id="sign-in-button" type="submit">Sign in <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="vertical-align:-0.2em;flex-shrink:0"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></button>
</form><div class="auth-links"><p>New here? <a href="../Create-Account/Create-Account.html">Create an account</a></p></div>
            </div>
        </section>
    </main>
    <footer class="auth-footer"><p>Independent project, not an official City of Johannesburg service.</p><a href="../Information/Information.html#contact">Help &amp; project information</a></footer>
