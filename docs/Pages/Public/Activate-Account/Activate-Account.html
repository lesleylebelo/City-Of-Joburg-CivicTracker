<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Activate account to CivicTrack. Your city. Your voice.">
    <title>Activate account | CivicTrack</title>
    <link rel="icon" href="../../../Assets/Images/CivicTrack-Mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../Assets/CSS/navigation.css">
    <link rel="stylesheet" href="../../../Assets/CSS/auth.css?v=85f49b409aac">
    <script src="../../../Assets/JS/auth-interface.js" defer></script>
    <script src="../../../Assets/JS/auth-registration.js" defer></script>
    <link rel="stylesheet" href="../../../Assets/CSS/city-brand.css?v=3d750b249636">
</head>
<body class="auth-page auth-page-registration">
    <a class="skip-link" href="#main-content">Skip to form</a>
    <header class="auth-header">
        <a class="auth-brand" href="../../../index.html"><span class="city-logo-shell brand-city-mark"><img class="city-logo" src="../../../Assets/Images/Joburg%20Logo.jpg" width="58" height="45" alt="City of Johannesburg"></span><span class="auth-brand-copy"><strong>CivicTrack</strong></span></a>
        <a class="auth-home" href="../../../index.html">Back home <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="vertical-align:-0.2em;flex-shrink:0"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></a>
    </header>
    <main class="auth-shell" id="main-content" tabindex="-1">
        <aside class="auth-scene" aria-label="Johannesburg"><p class="auth-scene-line">Report. Track. Improve Joburg.</p></aside>
        <section class="auth-panel" aria-labelledby="auth-form-heading">
            <div class="auth-form-content">
                <h1 id="auth-form-heading">Activate your account.</h1>
                <p class="auth-intro">Use your account access ID.</p>
                <form id="registration-form" class="auth-form" aria-describedby="registration-feedback" data-registration="activation">
<div class="auth-field auth-field-half"><label for="full-names">Full name</label><input id="full-names" name="full-names" type="text" autocomplete="name" maxlength="150" required aria-describedby="registration-feedback"></div>
<div class="auth-field auth-field-half"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="150" required aria-describedby="registration-feedback"></div>
<div class="auth-field"><label for="access-id">Account access ID</label><input id="access-id" name="access-id" type="text" autocomplete="off" maxlength="50" required aria-describedby="registration-feedback"></div>

<div id="password-help" class="auth-password-help"><ul class="auth-password-rules" aria-label="Password requirements"><li>8+ characters</li><li>Uppercase letter</li><li>Number</li></ul><p id="registration-feedback" class="auth-feedback" role="alert" aria-live="assertive" aria-atomic="true"></p></div>
<div class="auth-field auth-field-half"><label for="new-password">Password</label><div class="auth-password"><input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required data-password-label="password" aria-describedby="registration-feedback"><button class="auth-reveal" type="button" data-password-toggle="new-password" aria-controls="new-password" aria-pressed="false" aria-label="Show password">Show</button></div></div>
<div class="auth-field auth-field-half"><label for="confirm-password">Confirm password</label><div class="auth-password"><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required data-password-label="confirm password" aria-describedby="registration-feedback"><button class="auth-reveal" type="button" data-password-toggle="confirm-password" aria-controls="confirm-password" aria-pressed="false" aria-label="Show confirm password">Show</button></div></div>

<button class="auth-submit" id="registration-button" type="submit">Activate account <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="vertical-align:-0.2em;flex-shrink:0"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span></button>
</form><div class="auth-links"><p>Have an account? <a href="../Sign-In/Sign-In.html">Sign in</a></p></div>
            </div>
        </section>
    </main>
    <footer class="auth-footer"><p>Independent project, not an official City of Johannesburg service.</p><a href="../Information/Information.html#contact">Help &amp; project information</a></footer>
</body>
</html>
